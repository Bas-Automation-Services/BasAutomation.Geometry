# Publishes BasAutomation.Geometry to nuget.org via Trusted Publishing (OIDC —
# no stored API key). Triggered by the vX.Y.Z tag the Azure release pipeline
# pushes when it syncs this mirror. If a run fails after the tag exists,
# re-run it from the Actions tab.

name: Release to nuget.org

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build BasAutomation.Geometry.sln -c Release -p:Version=$VERSION

      - name: Test
        run: dotnet test BasAutomation.Geometry.sln -c Release --no-build -p:Version=$VERSION

      - name: Pack
        run: dotnet pack src/BasAutomation.Geometry/BasAutomation.Geometry.csproj -c Release --no-build -p:Version=$VERSION -o nupkg

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "nupkg/BasAutomation.Geometry.$VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
